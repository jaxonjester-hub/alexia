<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Until I See You</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffeef4;
      color: #333;
      margin: 0;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 18px;
      background: #fff8fb;
      border-bottom: 1px solid #f5c7d7;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: #8f3150;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 999px;
    }

    nav a.active {
      background: #d94d7b;
      color: white;
    }

    main {
      padding: 80px 20px;
      width: min(900px, 100%);
      margin: 0 auto;
    }

    h1 {
      font-size: 2.5rem;
    }

    #countdown {
      font-size: 2rem;
      margin-top: 30px;
      font-weight: bold;
    }

    .distance-scene {
      position: relative;
      height: 240px;
      margin: 48px auto 0;
      max-width: 760px;
      border-bottom: 3px solid #d94d7b;
    }

    .person {
      position: absolute;
      bottom: 0;
      width: 92px;
      height: 170px;
      transition: left 0.8s ease;
    }

    .person.man {
      left: 0;
    }

    .person.woman {
      left: calc(100% - 92px);
    }

    .head {
      width: 42px;
      height: 42px;
      border: 4px solid #333;
      border-radius: 50%;
      margin: 0 auto;
      background: #fff8fb;
    }

    .body {
      width: 4px;
      height: 58px;
      background: #333;
      margin: 0 auto;
    }

    .arms,
    .legs {
      position: relative;
      width: 70px;
      height: 34px;
      margin: -46px auto 0;
    }

    .legs {
      height: 52px;
      margin-top: 8px;
    }

    .arms::before,
    .arms::after,
    .legs::before,
    .legs::after {
      content: "";
      position: absolute;
      left: 33px;
      top: 0;
      width: 4px;
      background: #333;
      transform-origin: top;
    }

    .arms::before,
    .arms::after {
      height: 42px;
    }

    .legs::before,
    .legs::after {
      height: 58px;
    }

    .arms::before {
      transform: rotate(55deg);
    }

    .arms::after {
      transform: rotate(-55deg);
    }

    .legs::before {
      transform: rotate(24deg);
    }

    .legs::after {
      transform: rotate(-24deg);
    }

    .label {
      color: #8f3150;
      font-weight: bold;
      margin-top: 8px;
    }

    .progress-path {
      position: absolute;
      left: 104px;
      width: calc(100% - 208px);
      bottom: 82px;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }

    .progress-dot {
      width: 15px;
      height: 15px;
      justify-self: center;
      border-radius: 50%;
      background: #f3bfd0;
      border: 2px solid #e39bb6;
      opacity: 0.35;
      transform: scale(0.68);
      transition: opacity 0.4s ease, transform 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
    }

    .progress-dot.active {
      opacity: 1;
      transform: scale(1.42);
      background: #ff2f7d;
      border-color: #8f3150;
      box-shadow: 0 0 0 5px rgba(255, 47, 125, 0.18), 0 0 18px rgba(217, 77, 123, 0.9);
      animation: pulseDot 1.2s ease-in-out infinite;
    }

    .progress-dot.wave {
      opacity: 1;
      transform: scale(1.42);
      background: #ff2f7d;
      border-color: #8f3150;
      box-shadow: 0 0 0 5px rgba(255, 47, 125, 0.18), 0 0 18px rgba(217, 77, 123, 0.9);
      animation: pulseDot 0.8s ease-in-out infinite;
    }

    .progress-dot.hidden {
      visibility: hidden;
      opacity: 0;
      animation: none;
    }

    .progress-dot.met {
      border-radius: 2px;
      transform: rotate(45deg) scale(1.1);
    }

    .progress-dot.met::before,
    .progress-dot.met::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: inherit;
    }

    .progress-dot.met::before {
      left: -6px;
      top: 0;
    }

    .progress-dot.met::after {
      left: 0;
      top: -6px;
    }

    .easter-egg {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(255, 238, 244, 0.74);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .easter-egg.show {
      opacity: 1;
      pointer-events: auto;
    }

    .easter-egg-note {
      width: min(420px, 100%);
      padding: 26px 24px;
      border: 1px solid #f5c7d7;
      border-radius: 8px;
      background: #fff8fb;
      box-shadow: 0 18px 50px rgba(143, 49, 80, 0.22);
      color: #8f3150;
      font-size: 1.25rem;
      font-weight: bold;
      line-height: 1.45;
      transform: translateY(12px) scale(0.96);
      transition: transform 0.3s ease;
    }

    .easter-egg.show .easter-egg-note {
      transform: translateY(0) scale(1);
    }

    .easter-egg-note small {
      display: block;
      margin-top: 12px;
      color: #333;
      font-size: 0.9rem;
      font-weight: normal;
    }

    .floating-heart {
      position: fixed;
      bottom: 18px;
      left: var(--heart-left);
      color: #ff2f7d;
      font-size: var(--heart-size);
      pointer-events: none;
      animation: floatHeart 2.6s ease-out forwards;
      z-index: 21;
    }

    @keyframes pulseDot {
      0%,
      100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.45);
      }
    }

    @keyframes floatHeart {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.7) rotate(-8deg);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-78vh) scale(1.4) rotate(12deg);
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main pages">
    <a class="active" href="index.html">Countdown</a>
    <a href="timeline.html">Timeline</a>
    <a href="schedules.html">Schedules</a>
  </nav>

  <main>
    <h1>Countdown Until We See Each Other &hearts;</h1>
    <div id="countdown"></div>

    <div class="distance-scene" aria-label="Two people get closer as the countdown gets closer to zero.">
      <div id="progressPath" class="progress-path" aria-hidden="true"></div>

      <div id="man" class="person man">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arms"></div>
        <div class="legs"></div>
        <div class="label">Jaxon</div>
      </div>

      <div id="woman" class="person woman">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arms"></div>
        <div class="legs"></div>
        <div class="label">Alexia</div>
      </div>
    </div>
  </main>

  <div id="easterEgg" class="easter-egg" role="dialog" aria-modal="true" aria-label="Secret message" aria-hidden="true">
    <div class="easter-egg-note">
      Secret unlocked: every second is just one second closer to you &hearts;
      <small>Tap anywhere to hide this.</small>
    </div>
  </div>

  <script>
    const targetDate = new Date("2026-07-05T12:00:00").getTime();
    const startDate = new Date("2026-05-06T00:00:00").getTime();
    const man = document.getElementById("man");
    const woman = document.getElementById("woman");
    const progressPath = document.getElementById("progressPath");
    const easterEgg = document.getElementById("easterEgg");
    const secretWord = "alexia";
    let secretKeys = "";
    let alexiaClicks = 0;
    const dots = Array.from({ length: 14 }, () => {
      const dot = document.createElement("span");
      dot.className = "progress-dot";
      progressPath.appendChild(dot);
      return dot;
    });

    function updateProgressDots(progress) {
      const hiddenPerSide = Math.min(dots.length / 2, Math.floor(progress * (dots.length / 2)));

      dots.forEach((dot, index) => {
        const hiddenFromLeft = index < hiddenPerSide;
        const hiddenFromRight = index >= dots.length - hiddenPerSide;
        dot.classList.toggle("hidden", hiddenFromLeft || hiddenFromRight);
        dot.classList.toggle("active", progress >= 1);
        dot.classList.toggle("met", progress >= 1);
      });
    }

    function updateProgressPath(progress) {
      progressPath.style.opacity = progress >= 1 ? "0" : "1";
    }

    function animateProgressWave() {
      const now = Date.now();
      const visibleDots = dots.filter((dot) => !dot.classList.contains("hidden"));
      const half = Math.max(1, Math.ceil(visibleDots.length / 2));
      const waveStep = Math.floor((now / 180) % half);

      dots.forEach((dot, index) => {
        dot.classList.remove("wave");
      });

      visibleDots.forEach((dot, index) => {
        const leftIndex = waveStep;
        const rightIndex = visibleDots.length - 1 - waveStep;
        const nearLeft = index === leftIndex || index === leftIndex - 1;
        const nearRight = index === rightIndex || index === rightIndex + 1;

        dot.classList.toggle("wave", nearLeft || nearRight);
      });

      requestAnimationFrame(animateProgressWave);
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;
      const totalDistance = targetDate - startDate;
      const progress = Math.min(1, Math.max(0, (now - startDate) / totalDistance));
      const maxTravel = 42;

      man.style.left = (progress * maxTravel) + "%";
      woman.style.left = "calc(" + (100 - progress * maxTravel) + "% - 92px)";
      updateProgressDots(progress);
      updateProgressPath(progress);

      if (distance <= 0) {
        document.getElementById("countdown").innerHTML = "I get to see you today &hearts;";
        man.style.left = "42%";
        woman.style.left = "calc(58% - 92px)";
        updateProgressDots(1);
        updateProgressPath(1);
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("countdown").innerHTML =
        days + " days, " + hours + " hours, " + minutes + " minutes, " + seconds + " seconds";
    }

    function makeHeart(index) {
      const heart = document.createElement("span");
      heart.className = "floating-heart";
      heart.innerHTML = "&hearts;";
      heart.style.setProperty("--heart-left", (18 + Math.random() * 64) + "vw");
      heart.style.setProperty("--heart-size", (20 + Math.random() * 26) + "px");
      heart.style.animationDelay = (index * 0.08) + "s";
      document.body.appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }

    function showEasterEgg() {
      easterEgg.classList.add("show");
      easterEgg.setAttribute("aria-hidden", "false");
      Array.from({ length: 18 }, (_, index) => makeHeart(index));
    }

    function hideEasterEgg() {
      easterEgg.classList.remove("show");
      easterEgg.setAttribute("aria-hidden", "true");
    }

    document.addEventListener("keydown", (event) => {
      if (event.key.length !== 1) {
        return;
      }

      secretKeys = (secretKeys + event.key.toLowerCase()).slice(-secretWord.length);

      if (secretKeys === secretWord) {
        showEasterEgg();
        secretKeys = "";
      }
    });

    woman.querySelector(".label").addEventListener("click", () => {
      alexiaClicks += 1;

      if (alexiaClicks >= 5) {
        showEasterEgg();
        alexiaClicks = 0;
      }
    });

    easterEgg.addEventListener("click", hideEasterEgg);

    updateCountdown();
    animateProgressWave();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
