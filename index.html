<!DOCTYPE html>
<html>
<head>
  <title>Countdown Until I See You</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffeef4;
      color: #333;
      padding-top: 100px;
    }

    h1 {
      font-size: 2.5rem;
    }

    #countdown {
      font-size: 2rem;
      margin-top: 30px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Countdown Until I See My Girlfriend ❤️</h1>
  <div id="countdown"></div>

  <script>
    const targetDate = new Date("2026-07-05T12:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById("countdown").innerHTML = "I get to see you today ❤️";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("countdown").innerHTML =
        days + " days, " + hours + " hours, " + minutes + " minutes, " + seconds + " seconds";
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
