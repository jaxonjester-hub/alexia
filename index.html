<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be With Me?</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: #6f2343;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.9) 0 3px, transparent 4px),
        radial-gradient(circle at 85% 28%, rgba(255,255,255,.8) 0 4px, transparent 5px),
        linear-gradient(145deg, #ffe2ec, #fff5f8 55%, #f9c8da);
    }

    nav {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      font-family: Arial, sans-serif;
    }

    nav a {
      padding: 9px 16px;
      border-radius: 999px;
      color: #8f3150;
      font-weight: bold;
      text-decoration: none;
    }

    nav a.active { background: #d94d7b; color: white; }

    main {
      min-height: calc(100vh - 70px);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      position: relative;
      width: min(620px, 94vw);
      min-height: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px;
      border: 1px solid rgba(217, 77, 123, .25);
      border-radius: 30px;
      background: rgba(255, 255, 255, .74);
      box-shadow: 0 24px 70px rgba(143, 49, 80, .2);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .heart { font-size: 4rem; animation: beat 1.3s infinite; }
    h1 { margin: 14px 0 10px; font-size: clamp(2.2rem, 7vw, 4rem); }
    .subtitle { margin: 0 0 35px; color: #9e5772; font: 1.1rem Arial, sans-serif; }

    .buttons { display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 58px; }

    button {
      min-width: 120px;
      padding: 15px 28px;
      border: 0;
      border-radius: 999px;
      font: bold 1.1rem Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(143, 49, 80, .2);
      transition: transform .15s, box-shadow .15s;
    }

    #yesButton { background: #d94d7b; color: white; }
    #yesButton:hover { transform: scale(1.08); box-shadow: 0 12px 28px rgba(143,49,80,.32); }
    #noButton {
      background: white;
      color: #8f3150;
      border: 2px solid #edafc3;
      z-index: 10;
      transition: left .42s cubic-bezier(.22, .8, .32, 1),
                  top .42s cubic-bezier(.22, .8, .32, 1),
                  transform .18s ease;
      will-change: left, top;
    }

    #celebration {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle, rgba(92, 18, 57, .55), rgba(22, 5, 28, .94));
      opacity: 0;
      visibility: hidden;
      transition: opacity .5s;
    }

    #celebration.show { opacity: 1; visibility: visible; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    .message {
      position: relative;
      z-index: 2;
      max-width: 650px;
      padding: 38px;
      color: white;
      text-align: center;
      text-shadow: 0 3px 18px #3c0922;
      animation: rise .8s ease both;
    }

    .message h2 { margin: 0 0 16px; font-size: clamp(2.7rem, 9vw, 5.5rem); }
    .message p { margin: 0; font-size: clamp(1.15rem, 3vw, 1.55rem); line-height: 1.6; }

    #backButton {
      margin-top: 28px;
      color: #7b2448;
      background: white;
      border: 2px solid rgba(255, 255, 255, .7);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
    }

    #backButton:hover { transform: scale(1.06); }

    @keyframes beat { 50% { transform: scale(1.15); } }
    @keyframes rise { from { opacity: 0; transform: translateY(25px) scale(.95); } }

    @media (max-width: 520px) {
      nav { font-size: .85rem; padding: 10px 4px; }
      nav a { padding: 8px 10px; }
      .card { min-height: 420px; }
      .buttons { gap: 12px; }
      button { min-width: 105px; padding: 14px 22px; }
    }
  </style>
</head>
<body>
  <nav aria-label="Main pages">
    <a class="active" href="index.html">For You</a>
    <a href="timeline.html">Timeline</a>
    <a href="schedules.html">Schedules</a>
  </nav>

  <main>
    <section class="card">
      <div class="heart" aria-hidden="true">💗</div>
      <h1>Will you be with me?</h1>
      <p class="subtitle">There is only one right answer...</p>
      <div class="buttons">
        <button id="yesButton" type="button">Yes! 💕</button>
        <button id="noButton" type="button">No</button>
      </div>
    </section>
  </main>

  <section id="celebration" aria-hidden="true">
    <canvas id="fireworks"></canvas>
    <div class="message">
      <h2>I knew it! 💖</h2>
      <p>I could never love you more. I wish I just loved you better. I will work at this every day.</p>
      <button id="backButton" type="button">Go Back</button>
    </div>
  </section>

  <script>
    const noButton = document.getElementById("noButton");
    const yesButton = document.getElementById("yesButton");
    const backButton = document.getElementById("backButton");
    const celebration = document.getElementById("celebration");
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let celebrating = false;
    let fireworksTimer;

    let noButtonIsFixed = false;
    let lastMove = 0;

    function moveNoButton() {
      const now = Date.now();
      if (now - lastMove < 180) return;
      lastMove = now;

      const padding = 18;
      const viewportWidth = window.visualViewport?.width || window.innerWidth;
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      const width = noButton.offsetWidth;
      const height = noButton.offsetHeight;
      const maxX = Math.max(padding, viewportWidth - width - padding);
      const maxY = Math.max(padding, viewportHeight - height - padding);
      const newX = padding + Math.random() * Math.max(0, maxX - padding);
      const newY = padding + Math.random() * Math.max(0, maxY - padding);

      if (!noButtonIsFixed) {
        const rect = noButton.getBoundingClientRect();
        document.body.appendChild(noButton);
        noButton.style.position = "fixed";
        noButton.style.left = rect.left + "px";
        noButton.style.top = rect.top + "px";
        noButton.style.margin = "0";
        noButtonIsFixed = true;

        requestAnimationFrame(() => requestAnimationFrame(() => {
          noButton.style.left = newX + "px";
          noButton.style.top = newY + "px";
        }));
        return;
      }

      noButton.style.left = newX + "px";
      noButton.style.top = newY + "px";
    }

    noButton.addEventListener("pointerenter", moveNoButton);
    noButton.addEventListener("pointerdown", event => {
      event.preventDefault();
      moveNoButton();
    });
    noButton.addEventListener("focus", moveNoButton);

    document.addEventListener("pointermove", event => {
      const rect = noButton.getBoundingClientRect();
      const closestX = Math.max(rect.left, Math.min(event.clientX, rect.right));
      const closestY = Math.max(rect.top, Math.min(event.clientY, rect.bottom));
      const distance = Math.hypot(event.clientX - closestX, event.clientY - closestY);

      if (distance < 75) moveNoButton();
    });

    window.addEventListener("resize", () => {
      if (!noButtonIsFixed) return;
      const padding = 18;
      const viewportWidth = window.visualViewport?.width || window.innerWidth;
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      const left = Math.min(parseFloat(noButton.style.left), viewportWidth - noButton.offsetWidth - padding);
      const top = Math.min(parseFloat(noButton.style.top), viewportHeight - noButton.offsetHeight - padding);
      noButton.style.left = Math.max(padding, left) + "px";
      noButton.style.top = Math.max(padding, top) + "px";
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function burst(x, y) {
      const colors = ["#ff4f91", "#ffd166", "#82eefd", "#ffffff", "#c77dff"];
      for (let i = 0; i < 75; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          life: 1, color: colors[Math.floor(Math.random() * colors.length)] });
      }
    }

    function animate() {
      if (!celebrating) return;
      ctx.fillStyle = "rgba(20, 4, 25, .18)";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += .045; p.vx *= .99; p.life -= .012;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      particles = particles.filter(p => p.life > 0);
      requestAnimationFrame(animate);
    }

    yesButton.addEventListener("click", () => {
      if (celebrating) return;
      celebration.classList.add("show");
      celebration.setAttribute("aria-hidden", "false");
      celebrating = true;
      resizeCanvas();
      animate();
      burst(innerWidth * .25, innerHeight * .3);
      burst(innerWidth * .75, innerHeight * .25);
      burst(innerWidth * .5, innerHeight * .7);
      fireworksTimer = setInterval(() => burst(Math.random() * innerWidth, 80 + Math.random() * innerHeight * .55), 700);
    });

    backButton.addEventListener("click", () => {
      celebration.classList.remove("show");
      celebration.setAttribute("aria-hidden", "true");
      celebrating = false;
      clearInterval(fireworksTimer);
      particles = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    window.addEventListener("resize", resizeCanvas);
  </script>
</body>
</html>
