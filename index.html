<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Until I See You</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffeef4;
      color: #333;
      margin: 0;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 18px;
      background: #fff8fb;
      border-bottom: 1px solid #f5c7d7;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: #8f3150;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 999px;
    }

    nav a.active {
      background: #d94d7b;
      color: white;
    }

    main {
      padding: 80px 20px;
    }

    h1 {
      font-size: 2.5rem;
    }

    #countdown {
      font-size: 2rem;
      margin-top: 30px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <nav aria-label="Main pages">
    <a class="active" href="index.html">Countdown</a>
    <a href="timeline.html">Timeline</a>
  </nav>

  <main>
    <h1>Countdown Until I See My Girlfriend &hearts;</h1>
    <div id="countdown"></div>
  </main>

  <script>
    const targetDate = new Date("2026-07-05T12:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById("countdown").innerHTML = "I get to see you today &hearts;";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("countdown").innerHTML =
        days + " days, " + hours + " hours, " + minutes + " minutes, " + seconds + " seconds";
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
