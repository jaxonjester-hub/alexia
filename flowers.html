<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Would You Like Flowers?</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #6f2343; font-family: Arial, sans-serif; background: linear-gradient(145deg,#fff0f5,#fffafc 55%,#f8cddd); }
    nav { display:flex; justify-content:center; gap:8px; padding:16px; flex-wrap:wrap; }
    nav a { padding:9px 16px; border-radius:999px; color:#8f3150; font-weight:bold; text-decoration:none; }
    nav a.active { color:white; background:#d94d7b; }
    main { min-height:calc(100vh - 76px); display:grid; place-items:center; padding:24px; }
    .card { width:min(600px,100%); padding:52px 28px; border:1px solid #f2bbce; border-radius:30px; background:rgba(255,255,255,.82); box-shadow:0 24px 70px rgba(143,49,80,.18); text-align:center; }
    .bouquet { font-size:5rem; }
    h1 { margin:18px 0 12px; font:clamp(2.2rem,7vw,3.7rem) Georgia,serif; }
    .intro { margin:0 auto 30px; max-width:430px; color:#9e5772; font-size:1.1rem; line-height:1.6; }
    button { padding:16px 30px; border:0; border-radius:999px; color:white; background:#d94d7b; box-shadow:0 10px 24px rgba(143,49,80,.25); font-size:1.1rem; font-weight:bold; cursor:pointer; }
    button:hover { transform:scale(1.06); }
    button:disabled { opacity:.65; cursor:wait; transform:none; }
    #status { min-height:28px; margin:22px 0 0; font-weight:bold; line-height:1.5; }
    #status.success { color:#25834f; }
  </style>
</head>
<body>
  <nav aria-label="Main pages">
    <a href="index.html">For You</a>
    <a href="timeline.html">Timeline</a>
    <a href="schedules.html">Schedules</a>
    <a class="active" href="flowers.html">Flowers</a>
  </nav>
  <main>
    <section class="card">
      <div class="bouquet" aria-hidden="true">💐</div>
      <h1>Would you like flowers?</h1>
      <p class="intro">If flowers would make your day a little brighter, press the button and I’ll send a hint his way.</p>
      <button id="requestButton" type="button">Yes, I’d love flowers!</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const requestButton = document.getElementById("requestButton");
    const status = document.getElementById("status");

    requestButton.addEventListener("click", async () => {
      if (!confirm("Send a flower request now?")) return;
      requestButton.disabled = true;
      status.className = "";
      status.textContent = "Sending your hint...";

      try {
        const response = await fetch("/api/flower-request", { method: "POST" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "The request could not be sent.");
        status.className = "success";
        status.textContent = "Your flower request was sent! 💐";
        requestButton.textContent = "Request sent 💕";
      } catch (error) {
        status.textContent = error.message;
        requestButton.disabled = false;
      }
    });
  </script>
</body>
</html>
