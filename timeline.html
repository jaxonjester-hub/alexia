<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Trip Timeline</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffeef4;
      color: #333;
      margin: 0;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 18px;
      background: #fff8fb;
      border-bottom: 1px solid #f5c7d7;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: #8f3150;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 999px;
    }

    nav a.active {
      background: #d94d7b;
      color: white;
    }

    main {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 42px 20px 64px;
    }

    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin: 0 0 28px;
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.8fr);
      gap: 18px;
      background: #fff8fb;
      border: 1px solid #f5c7d7;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 34px;
    }

    .form-section {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #7c2b47;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #e9a9bf;
      border-radius: 8px;
      color: #333;
      font: inherit;
      padding: 10px 12px;
      background: white;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input[type="file"] {
      min-height: 118px;
      padding: 36px 14px;
      background: white;
      border: 2px dashed #e9a9bf;
      cursor: pointer;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: #d94d7b;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      padding: 11px 18px;
    }

    button:hover {
      background: #bd3c68;
    }

    .status {
      color: #7c2b47;
      min-height: 22px;
      margin: 0;
    }

    .timeline {
      display: grid;
      gap: 22px;
    }

    .empty {
      text-align: center;
      color: #7c2b47;
      background: #fff8fb;
      border: 1px dashed #e9a9bf;
      border-radius: 8px;
      padding: 30px 18px;
    }

    .trip {
      background: #fff8fb;
      border: 1px solid #f5c7d7;
      border-radius: 8px;
      overflow: hidden;
    }

    .trip-cover {
      position: relative;
      display: block;
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: #f5c7d7;
      cursor: pointer;
    }

    .trip-cover img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #f5c7d7;
      display: block;
    }

    .photo-count {
      position: absolute;
      right: 14px;
      bottom: 14px;
      color: white;
      background: rgba(51, 51, 51, 0.78);
      border-radius: 999px;
      font-weight: bold;
      padding: 8px 12px;
    }

    .trip-body {
      padding: 18px;
    }

    .trip-date {
      color: #8f3150;
      font-weight: bold;
    }

    .trip h2 {
      margin: 6px 0 10px;
      font-size: 1.55rem;
    }

    .trip p {
      line-height: 1.55;
      margin: 0 0 14px;
    }

    .delete-button {
      background: transparent;
      border: 1px solid #e9a9bf;
      color: #8f3150;
      padding: 8px 12px;
    }

    .delete-button:hover {
      background: #ffeef4;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: none;
      grid-template-rows: auto 1fr;
      background: rgba(30, 20, 25, 0.92);
      z-index: 20;
      padding: 18px;
    }

    .viewer.open {
      display: grid;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: white;
      padding-bottom: 14px;
    }

    .viewer-title {
      font-weight: bold;
      margin: 0;
    }

    .viewer-close {
      background: white;
      color: #333;
      padding: 9px 14px;
    }

    .viewer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      overflow: auto;
      padding-bottom: 12px;
    }

    .viewer-grid img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #f5c7d7;
    }

    @media (max-width: 760px) {
      form,
      .form-row {
        grid-template-columns: 1fr;
      }

      .trip-cover img {
        height: 230px;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main pages">
    <a href="index.html">Countdown</a>
    <a class="active" href="timeline.html">Timeline</a>
  </nav>

  <main>
    <h1>Our Trip Timeline</h1>

    <form id="tripForm">
      <div class="form-section">
        <label>
          Trip title
          <input name="title" type="text" placeholder="New York weekend, beach trip, summer visit..." required>
        </label>

        <div class="form-row">
          <label>
            Start date
            <input name="startDate" type="date" required>
          </label>

          <label>
            End date
            <input name="endDate" type="date">
          </label>
        </div>

        <label>
          What happened
          <textarea name="note" placeholder="Write the story of the trip..." required></textarea>
        </label>
      </div>

      <div class="form-section">
        <label>
          Trip pictures
          <input name="photos" type="file" accept="image/*" multiple required>
        </label>

        <div class="actions">
          <button type="submit">Add trip</button>
          <p id="status" class="status"></p>
        </div>
      </div>
    </form>

    <section id="timeline" class="timeline" aria-live="polite"></section>
  </main>

  <div id="viewer" class="viewer" aria-hidden="true">
    <div class="viewer-header">
      <p id="viewerTitle" class="viewer-title"></p>
      <button id="viewerClose" class="viewer-close" type="button">Close</button>
    </div>
    <div id="viewerGrid" class="viewer-grid"></div>
  </div>

  <script>
    const form = document.getElementById("tripForm");
    const timeline = document.getElementById("timeline");
    const status = document.getElementById("status");
    const viewer = document.getElementById("viewer");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerGrid = document.getElementById("viewerGrid");
    const viewerClose = document.getElementById("viewerClose");
    let currentTrips = [];

    function setStatus(message) {
      status.textContent = message;
    }

    function formatDate(dateValue) {
      const date = new Date(dateValue + "T00:00:00");
      return date.toLocaleDateString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function formatDateRange(trip) {
      if (!trip.endDate || trip.endDate === trip.startDate) {
        return formatDate(trip.startDate);
      }

      return formatDate(trip.startDate) + " - " + formatDate(trip.endDate);
    }

    async function getTrips() {
      const response = await fetch("/api/memories");

      if (!response.ok) {
        throw new Error("Could not load the timeline.");
      }

      return response.json();
    }

    async function renderTimeline() {
      const trips = await getTrips();
      currentTrips = trips;
      timeline.innerHTML = "";

      if (trips.length === 0) {
        timeline.innerHTML = '<div class="empty">Add the first trip above.</div>';
        return;
      }

      trips.forEach((trip) => {
        const article = document.createElement("article");
        article.className = "trip";

        const cover = document.createElement("button");
        cover.className = "trip-cover";
        cover.type = "button";
        cover.dataset.id = trip.id;

        const image = document.createElement("img");
        image.src = trip.photos[0];
        image.alt = "";

        const count = document.createElement("span");
        count.className = "photo-count";
        count.textContent = "View " + trip.photos.length + " photo" + (trip.photos.length === 1 ? "" : "s");

        cover.append(image, count);

        const body = document.createElement("div");
        body.className = "trip-body";

        const date = document.createElement("div");
        date.className = "trip-date";
        date.textContent = formatDateRange(trip);

        const title = document.createElement("h2");
        title.textContent = trip.title;

        const note = document.createElement("p");
        note.textContent = trip.note;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.dataset.id = trip.id;
        deleteButton.textContent = "Delete trip";

        body.append(date, title, note, deleteButton);
        article.append(cover, body);
        timeline.appendChild(article);
      });
    }

    function openViewer(trip) {
      viewerTitle.textContent = trip.title + " photos";
      viewerGrid.innerHTML = "";

      trip.photos.forEach((photo) => {
        const image = document.createElement("img");
        image.src = photo;
        image.alt = "";
        viewerGrid.appendChild(image);
      });

      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
    }

    function closeViewer() {
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("Saving...");

      try {
        const response = await fetch("/api/memories", {
          method: "POST",
          body: new FormData(form)
        });

        if (!response.ok) {
          const details = await response.json();
          throw new Error(details.error || "The trip could not be saved.");
        }

        form.reset();
        setStatus("Saved.");
        await renderTimeline();
      } catch (error) {
        setStatus(error.message);
      }
    });

    timeline.addEventListener("click", async (event) => {
      const cover = event.target.closest(".trip-cover");

      if (cover) {
        const trip = currentTrips.find((item) => item.id === cover.dataset.id);

        if (trip) {
          openViewer(trip);
        }

        return;
      }

      if (!event.target.matches(".delete-button")) {
        return;
      }

      const response = await fetch("/api/memories/" + event.target.dataset.id, {
        method: "DELETE"
      });

      if (response.ok) {
        await renderTimeline();
      }
    });

    viewerClose.addEventListener("click", closeViewer);
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) {
        closeViewer();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeViewer();
      }
    });

    renderTimeline().catch((error) => {
      timeline.innerHTML = '<div class="empty">Start the server to load the shared timeline.</div>';
      setStatus(error.message);
    });
  </script>
</body>
</html>
