<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Trip Timeline</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffeef4;
      color: #333;
      margin: 0;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 18px;
      background: #fff8fb;
      border-bottom: 1px solid #f5c7d7;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: #8f3150;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 999px;
    }

    nav a.active {
      background: #d94d7b;
      color: white;
    }

    main {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 48px 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin: 0 0 28px;
    }

    form {
      display: grid;
      gap: 14px;
      background: #fff8fb;
      border: 1px solid #f5c7d7;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 34px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #7c2b47;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #e9a9bf;
      border-radius: 8px;
      color: #333;
      font: inherit;
      padding: 10px 12px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      justify-self: start;
      border: 0;
      border-radius: 999px;
      background: #d94d7b;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      padding: 11px 18px;
    }

    button:hover {
      background: #bd3c68;
    }

    .status {
      color: #7c2b47;
      min-height: 22px;
      margin: 0;
    }

    .timeline {
      display: grid;
      gap: 18px;
    }

    .empty {
      text-align: center;
      color: #7c2b47;
      background: #fff8fb;
      border: 1px dashed #e9a9bf;
      border-radius: 8px;
      padding: 30px 18px;
    }

    .memory {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 18px;
      align-items: start;
      background: #fff8fb;
      border: 1px solid #f5c7d7;
      border-radius: 8px;
      padding: 14px;
    }

    .memory img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #f5c7d7;
    }

    .memory time {
      color: #8f3150;
      font-weight: bold;
    }

    .memory h2 {
      margin: 6px 0 8px;
      font-size: 1.35rem;
    }

    .memory p {
      line-height: 1.55;
      margin: 0 0 12px;
    }

    .delete-button {
      background: transparent;
      border: 1px solid #e9a9bf;
      color: #8f3150;
      padding: 8px 12px;
    }

    .delete-button:hover {
      background: #ffeef4;
    }

    @media (max-width: 640px) {
      .form-row,
      .memory {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main pages">
    <a href="index.html">Countdown</a>
    <a class="active" href="timeline.html">Timeline</a>
  </nav>

  <main>
    <h1>Our Trip Timeline</h1>

    <form id="memoryForm">
      <div class="form-row">
        <label>
          Trip date
          <input id="memoryDate" name="date" type="date" required>
        </label>

        <label>
          Title
          <input id="memoryTitle" name="title" type="text" placeholder="Beach day, first dinner, airport..." required>
        </label>
      </div>

      <label>
        Picture
        <input id="memoryPhoto" name="photo" type="file" accept="image/*" required>
      </label>

      <label>
        Memory
        <textarea id="memoryNote" name="note" placeholder="Write what happened that day..." required></textarea>
      </label>

      <button type="submit">Add to timeline</button>
      <p id="status" class="status"></p>
    </form>

    <section id="timeline" class="timeline" aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById("memoryForm");
    const timeline = document.getElementById("timeline");
    const status = document.getElementById("status");

    function setStatus(message) {
      status.textContent = message;
    }

    function formatDate(dateValue) {
      const date = new Date(dateValue + "T00:00:00");
      return date.toLocaleDateString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    async function getMemories() {
      const response = await fetch("/api/memories");

      if (!response.ok) {
        throw new Error("Could not load the timeline.");
      }

      return response.json();
    }

    async function renderTimeline() {
      const memories = await getMemories();
      timeline.innerHTML = "";

      if (memories.length === 0) {
        timeline.innerHTML = '<div class="empty">Add the first trip memory above.</div>';
        return;
      }

      memories.forEach((memory) => {
        const article = document.createElement("article");
        article.className = "memory";

        const image = document.createElement("img");
        image.src = memory.photo;
        image.alt = "";

        const content = document.createElement("div");

        const date = document.createElement("time");
        date.dateTime = memory.date;
        date.textContent = formatDate(memory.date);

        const title = document.createElement("h2");
        title.textContent = memory.title;

        const note = document.createElement("p");
        note.textContent = memory.note;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.dataset.id = memory.id;
        deleteButton.textContent = "Delete";

        content.append(date, title, note, deleteButton);
        article.append(image, content);

        timeline.appendChild(article);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("Saving...");

      try {
        const response = await fetch("/api/memories", {
          method: "POST",
          body: new FormData(form)
        });

        if (!response.ok) {
          throw new Error("The memory could not be saved.");
        }

        form.reset();
        setStatus("Saved.");
        await renderTimeline();
      } catch (error) {
        setStatus(error.message);
      }
    });

    timeline.addEventListener("click", async (event) => {
      if (!event.target.matches(".delete-button")) {
        return;
      }

      const id = event.target.dataset.id;

      const response = await fetch("/api/memories/" + id, {
        method: "DELETE"
      });

      if (response.ok) {
        await renderTimeline();
      }
    });

    renderTimeline().catch((error) => {
      timeline.innerHTML = '<div class="empty">Start the server to load the shared timeline.</div>';
      setStatus(error.message);
    });
  </script>
</body>
</html>
