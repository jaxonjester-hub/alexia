<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Trip Timeline</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffeef4;
      color: #333;
      margin: 0;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 18px;
      background: #fff8fb;
      border-bottom: 1px solid #f5c7d7;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: #8f3150;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 999px;
    }

    nav a.active {
      background: #d94d7b;
      color: white;
    }

    main {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 42px 20px 64px;
    }

    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin: 0 0 28px;
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.8fr);
      gap: 18px;
      background: #fff8fb;
      border: 1px solid #f5c7d7;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 34px;
    }

    .form-section {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #7c2b47;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #e9a9bf;
      border-radius: 8px;
      color: #333;
      font: inherit;
      padding: 10px 12px;
      background: white;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input[type="file"] {
      min-height: 118px;
      padding: 36px 14px;
      background: white;
      border: 2px dashed #e9a9bf;
      cursor: pointer;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: #d94d7b;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      padding: 11px 18px;
    }

    button:hover {
      background: #bd3c68;
    }

    .status {
      color: #7c2b47;
      min-height: 22px;
      margin: 0;
    }

    .edit-lock {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
      background: #fff8fb;
      border: 1px solid #f5c7d7;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .edit-lock label {
      flex: 1 1 240px;
    }

    .locked {
      display: none !important;
    }

    .timeline {
      display: grid;
      gap: 22px;
    }

    .empty {
      text-align: center;
      color: #7c2b47;
      background: #fff8fb;
      border: 1px dashed #e9a9bf;
      border-radius: 8px;
      padding: 30px 18px;
    }

    .trip {
      background: #fff8fb;
      border: 1px solid #f5c7d7;
      border-radius: 8px;
      overflow: hidden;
    }

    .trip-cover {
      position: relative;
      display: block;
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: #f5c7d7;
      cursor: pointer;
    }

    .trip-cover img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #f5c7d7;
      display: block;
    }

    .photo-count {
      position: absolute;
      right: 14px;
      bottom: 14px;
      color: white;
      background: rgba(51, 51, 51, 0.78);
      border-radius: 999px;
      font-weight: bold;
      padding: 8px 12px;
    }

    .trip-body {
      padding: 18px;
    }

    .trip-date {
      color: #8f3150;
      font-weight: bold;
    }

    .trip h2 {
      margin: 6px 0 10px;
      font-size: 1.55rem;
    }

    .trip p {
      line-height: 1.55;
      margin: 0 0 14px;
    }

    .trip-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .add-photo-button,
    .delete-photos-button,
    .delete-button {
      background: transparent;
      border: 1px solid #e9a9bf;
      color: #8f3150;
      padding: 8px 12px;
    }

    .add-photo-button:hover,
    .delete-photos-button:hover,
    .delete-button:hover {
      background: #ffeef4;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: none;
      grid-template-rows: auto 1fr;
      background: rgba(30, 20, 25, 0.92);
      z-index: 20;
      padding: 18px;
    }

    .viewer.open {
      display: grid;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: white;
      padding-bottom: 14px;
    }

    .viewer-title {
      font-weight: bold;
      margin: 0;
    }

    .viewer-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .viewer-status {
      color: white;
      font-weight: bold;
      margin: 0;
      min-height: 20px;
      width: 100%;
    }

    .viewer-close {
      background: white;
      color: #333;
      padding: 9px 14px;
    }

    .viewer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      overflow: auto;
      padding-bottom: 12px;
    }

    .viewer-photo {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .viewer-photo button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 0;
      background: transparent;
      cursor: zoom-in;
    }

    .viewer-photo img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #f5c7d7;
    }

    .viewer-photo.current img {
      outline: 4px solid #ff2f7d;
      outline-offset: -4px;
    }

    .viewer.selecting-cover .viewer-photo button {
      cursor: pointer;
    }

    .viewer.selecting-cover .viewer-photo button:hover img {
      outline: 4px solid white;
      outline-offset: -4px;
    }

    .viewer.deleting-photos .viewer-photo button {
      cursor: pointer;
    }

    .viewer-photo.selected img {
      outline: 4px solid #ffffff;
      outline-offset: -4px;
      filter: brightness(0.72);
    }

    .viewer-photo.selected::after {
      align-self: start;
      background: white;
      border-radius: 999px;
      color: #8f3150;
      content: "Selected";
      font-weight: bold;
      justify-self: center;
      margin-top: -46px;
      padding: 8px 12px;
      position: relative;
      z-index: 1;
    }

    .photo-label {
      color: white;
      font-weight: bold;
      min-height: 20px;
      text-align: center;
    }

    .cover-button {
      background: white;
      color: #8f3150;
      padding: 9px 12px;
    }

    .cover-button.active {
      background: #ffeef4;
      color: #333;
    }

    .delete-mode-button {
      background: white;
      color: #8f3150;
      padding: 8px 12px;
    }

    .delete-mode-button.active,
    .confirm-delete-button {
      background: #d94d7b;
      color: white;
      padding: 8px 12px;
    }

    .confirm-delete-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .photo-lightbox {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(15, 10, 13, 0.94);
      z-index: 30;
      padding: 20px;
    }

    .photo-lightbox.open {
      display: grid;
    }

    .photo-lightbox img {
      max-width: 96vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 8px;
      background: white;
    }

    .lightbox-close {
      position: fixed;
      right: 18px;
      top: 18px;
      background: white;
      color: #333;
    }

    @media (max-width: 760px) {
      form,
      .form-row {
        grid-template-columns: 1fr;
      }

      .trip-cover img {
        height: 230px;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Main pages">
    <a href="index.html">Countdown</a>
    <a class="active" href="timeline.html">Timeline</a>
    <a href="schedules.html">Schedules</a>
  </nav>

  <main>
    <h1>Our Trip Timeline</h1>

    <section id="editLock" class="edit-lock">
      <label>
        Edit password
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Enter password to make changes">
      </label>
      <button id="unlockButton" type="button">Unlock edits</button>
    </section>

    <form id="tripForm" class="locked">
      <div class="form-section">
        <label>
          Trip title
          <input name="title" type="text" placeholder="New York weekend, beach trip, summer visit..." required>
        </label>

        <div class="form-row">
          <label>
            Start date
            <input name="startDate" type="date" required>
          </label>

          <label>
            End date
            <input name="endDate" type="date">
          </label>
        </div>

        <label>
          What happened
          <textarea name="note" placeholder="Write the story of the trip..." required></textarea>
        </label>
      </div>

      <div class="form-section">
        <label>
          Trip pictures
          <input name="photos" type="file" accept="image/*" multiple required>
        </label>

        <div class="actions">
          <button type="submit">Add trip</button>
          <p id="status" class="status"></p>
        </div>
      </div>
    </form>

    <section id="timeline" class="timeline" aria-live="polite"></section>
    <input id="tripPhotoInput" type="file" accept="image/*" multiple hidden>
  </main>

  <div id="viewer" class="viewer" aria-hidden="true">
    <div class="viewer-header">
      <p id="viewerTitle" class="viewer-title"></p>
      <div class="viewer-actions">
        <button id="coverModeButton" class="cover-button" type="button">Make cover</button>
        <button id="deleteModeButton" class="delete-mode-button" type="button">Delete photos</button>
        <button id="confirmDeleteButton" class="confirm-delete-button" type="button" hidden disabled>Are you sure? Delete selected</button>
        <button id="viewerClose" class="viewer-close" type="button">Close</button>
        <p id="viewerStatus" class="viewer-status"></p>
      </div>
    </div>
    <div id="viewerGrid" class="viewer-grid"></div>
  </div>

  <div id="photoLightbox" class="photo-lightbox" aria-hidden="true">
    <button id="lightboxClose" class="lightbox-close" type="button">Close</button>
    <img id="lightboxImage" alt="">
  </div>

  <script>
    const form = document.getElementById("tripForm");
    const editLock = document.getElementById("editLock");
    const passwordInput = document.getElementById("passwordInput");
    const unlockButton = document.getElementById("unlockButton");
    const timeline = document.getElementById("timeline");
    const status = document.getElementById("status");
    const tripPhotoInput = document.getElementById("tripPhotoInput");
    const viewer = document.getElementById("viewer");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerGrid = document.getElementById("viewerGrid");
    const viewerClose = document.getElementById("viewerClose");
    const coverModeButton = document.getElementById("coverModeButton");
    const deleteModeButton = document.getElementById("deleteModeButton");
    const confirmDeleteButton = document.getElementById("confirmDeleteButton");
    const viewerStatus = document.getElementById("viewerStatus");
    const photoLightbox = document.getElementById("photoLightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxClose = document.getElementById("lightboxClose");
    let currentTrips = [];
    let openTrip = null;
    let photoUploadTripId = "";
    let selectingCover = false;
    let deletingPhotos = false;
    let selectedPhotos = new Set();

    function getSitePassword() {
      return sessionStorage.getItem("sitePassword") || "";
    }

    function authHeaders(extraHeaders = {}) {
      const password = getSitePassword();
      return password ? { ...extraHeaders, "X-Site-Password": password } : extraHeaders;
    }

    function updateEditLock() {
      const unlocked = Boolean(getSitePassword());
      form.classList.toggle("locked", !unlocked);
      editLock.classList.toggle("locked", unlocked);
      coverModeButton.classList.toggle("locked", !unlocked);
      deleteModeButton.classList.toggle("locked", !unlocked);
      confirmDeleteButton.classList.toggle("locked", !unlocked);
    }

    unlockButton.addEventListener("click", () => {
      const password = passwordInput.value.trim();

      if (!password) {
        setStatus("Enter the password first.");
        return;
      }

      sessionStorage.setItem("sitePassword", password);
      passwordInput.value = "";
      updateEditLock();
      setStatus("Edits unlocked.");
      renderTimeline().catch((error) => setStatus(error.message));
    });

    function setStatus(message) {
      status.textContent = message;
    }

    function formatDate(dateValue) {
      const date = new Date(dateValue + "T00:00:00");
      return date.toLocaleDateString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function formatDateRange(trip) {
      if (!trip.endDate || trip.endDate === trip.startDate) {
        return formatDate(trip.startDate);
      }

      return formatDate(trip.startDate) + " - " + formatDate(trip.endDate);
    }

    async function getTrips() {
      const response = await fetch("/api/memories");

      if (!response.ok) {
        throw new Error("Could not load the timeline.");
      }

      return response.json();
    }

    async function renderTimeline() {
      const trips = await getTrips();
      currentTrips = trips;
      timeline.innerHTML = "";

      if (trips.length === 0) {
        timeline.innerHTML = '<div class="empty">Add the first trip above.</div>';
        return;
      }

      trips.forEach((trip) => {
        const article = document.createElement("article");
        article.className = "trip";

        const cover = document.createElement("button");
        cover.className = "trip-cover";
        cover.type = "button";
        cover.dataset.id = trip.id;

        const image = document.createElement("img");
        image.src = trip.coverPhoto || trip.photos[0];
        image.alt = "";

        const count = document.createElement("span");
        count.className = "photo-count";
        count.textContent = "View " + trip.photos.length + " photo" + (trip.photos.length === 1 ? "" : "s");

        cover.append(image, count);

        const body = document.createElement("div");
        body.className = "trip-body";

        const date = document.createElement("div");
        date.className = "trip-date";
        date.textContent = formatDateRange(trip);

        const title = document.createElement("h2");
        title.textContent = trip.title;

        const note = document.createElement("p");
        note.textContent = trip.note;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.dataset.id = trip.id;
        deleteButton.textContent = "Delete trip";

        const addPhotoButton = document.createElement("button");
        addPhotoButton.className = "add-photo-button";
        addPhotoButton.type = "button";
        addPhotoButton.dataset.id = trip.id;
        addPhotoButton.textContent = "Add photos";

        const deletePhotosButton = document.createElement("button");
        deletePhotosButton.className = "delete-photos-button";
        deletePhotosButton.type = "button";
        deletePhotosButton.dataset.id = trip.id;
        deletePhotosButton.textContent = "Delete photos";

        const actions = document.createElement("div");
        actions.className = "trip-actions";
        if (getSitePassword()) {
          actions.append(addPhotoButton, deletePhotosButton, deleteButton);
        }

        body.append(date, title, note, actions);
        article.append(cover, body);
        timeline.appendChild(article);
      });
    }

    function openViewer(trip) {
      openTrip = trip;
      selectingCover = false;
      deletingPhotos = false;
      selectedPhotos = new Set();
      viewerTitle.textContent = trip.title + " photos";
      viewerGrid.innerHTML = "";
      viewer.classList.remove("selecting-cover");
      viewer.classList.remove("deleting-photos");
      coverModeButton.classList.remove("active");
      deleteModeButton.classList.remove("active");
      coverModeButton.classList.toggle("locked", !getSitePassword());
      deleteModeButton.classList.toggle("locked", !getSitePassword());
      confirmDeleteButton.classList.toggle("locked", !getSitePassword());
      coverModeButton.textContent = "Make cover";
      deleteModeButton.textContent = "Delete photos";
      confirmDeleteButton.hidden = true;
      confirmDeleteButton.disabled = true;
      confirmDeleteButton.textContent = "Are you sure? Delete selected";
      viewerStatus.textContent = "";

      trip.photos.forEach((photo) => {
        const item = document.createElement("div");
        item.className = "viewer-photo";

        if (photo === trip.coverPhoto) {
          item.classList.add("current");
        }

        const photoButton = document.createElement("button");
        photoButton.type = "button";
        photoButton.dataset.photo = photo;

        const image = document.createElement("img");
        image.src = photo;
        image.alt = "";

        const label = document.createElement("div");
        label.className = "photo-label";
        label.textContent = photo === trip.coverPhoto ? "Current cover" : "";

        photoButton.appendChild(image);
        item.append(photoButton, label);
        viewerGrid.appendChild(item);
      });

      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
    }

    function closeViewer() {
      viewer.classList.remove("open");
      viewer.classList.remove("selecting-cover");
      viewer.classList.remove("deleting-photos");
      viewer.setAttribute("aria-hidden", "true");
      openTrip = null;
      selectingCover = false;
      deletingPhotos = false;
      selectedPhotos = new Set();
    }

    function updateDeleteControls() {
      const selectedCount = selectedPhotos.size;
      const wouldDeleteEveryPhoto = openTrip && selectedCount >= openTrip.photos.length;
      confirmDeleteButton.disabled = selectedCount === 0 || wouldDeleteEveryPhoto;
      confirmDeleteButton.textContent = selectedCount === 0 || wouldDeleteEveryPhoto
        ? "Are you sure? Delete selected"
        : "Are you sure? Delete " + selectedCount;

      if (wouldDeleteEveryPhoto) {
        viewerStatus.textContent = "A trip needs at least one picture. Leave one photo or delete the whole trip.";
      } else if (deletingPhotos) {
        viewerStatus.textContent = selectedCount === 0 ? "Select the photos you want to delete." : "";
      }
    }

    function enterDeleteMode() {
      deletingPhotos = true;
      selectingCover = false;
      selectedPhotos = new Set();
      viewer.classList.add("deleting-photos");
      viewer.classList.remove("selecting-cover");
      deleteModeButton.classList.add("active");
      deleteModeButton.textContent = "Cancel delete";
      coverModeButton.classList.remove("active");
      coverModeButton.textContent = "Make cover";
      confirmDeleteButton.hidden = false;
      viewerStatus.textContent = "Select the photos you want to delete.";
      viewerGrid.querySelectorAll(".viewer-photo.selected").forEach((item) => item.classList.remove("selected"));
      updateDeleteControls();
    }

    function exitDeleteMode() {
      deletingPhotos = false;
      selectedPhotos = new Set();
      viewer.classList.remove("deleting-photos");
      deleteModeButton.classList.remove("active");
      deleteModeButton.textContent = "Delete photos";
      confirmDeleteButton.hidden = true;
      viewerStatus.textContent = "";
      viewerGrid.querySelectorAll(".viewer-photo.selected").forEach((item) => item.classList.remove("selected"));
      updateDeleteControls();
    }

    function togglePhotoSelection(photoButton) {
      const photo = photoButton.dataset.photo;
      const item = photoButton.closest(".viewer-photo");

      if (selectedPhotos.has(photo)) {
        selectedPhotos.delete(photo);
        item.classList.remove("selected");
      } else {
        selectedPhotos.add(photo);
        item.classList.add("selected");
      }

      updateDeleteControls();
    }

    function openLightbox(photo) {
      lightboxImage.src = photo;
      photoLightbox.classList.add("open");
      photoLightbox.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      photoLightbox.classList.remove("open");
      photoLightbox.setAttribute("aria-hidden", "true");
      lightboxImage.src = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("Saving...");

      try {
        const response = await fetch("/api/memories", {
          method: "POST",
          headers: authHeaders(),
          body: new FormData(form)
        });

        if (!response.ok) {
          const details = await response.json();
          throw new Error(details.error || "The trip could not be saved.");
        }

        form.reset();
        setStatus("Saved.");
        await renderTimeline();
      } catch (error) {
        setStatus(error.message);
      }
    });

    timeline.addEventListener("click", async (event) => {
      const cover = event.target.closest(".trip-cover");

      if (cover) {
        const trip = currentTrips.find((item) => item.id === cover.dataset.id);

        if (trip) {
          openViewer(trip);
        }

        return;
      }

      const addPhotoButton = event.target.closest(".add-photo-button");

      if (addPhotoButton) {
        photoUploadTripId = addPhotoButton.dataset.id;
        tripPhotoInput.value = "";
        tripPhotoInput.click();
        return;
      }

      const deletePhotosButton = event.target.closest(".delete-photos-button");

      if (deletePhotosButton) {
        const trip = currentTrips.find((item) => item.id === deletePhotosButton.dataset.id);

        if (trip) {
          openViewer(trip);
          enterDeleteMode();
        }

        return;
      }

      if (!event.target.matches(".delete-button")) {
        return;
      }

      const response = await fetch("/api/memories/" + event.target.dataset.id, {
        method: "DELETE",
        headers: authHeaders()
      });

      if (response.ok) {
        await renderTimeline();
      }
    });

    tripPhotoInput.addEventListener("change", async () => {
      if (!photoUploadTripId || tripPhotoInput.files.length === 0) {
        return;
      }

      const data = new FormData();

      Array.from(tripPhotoInput.files).forEach((file) => {
        data.append("photos", file);
      });

      setStatus("Adding photos...");

      try {
        const response = await fetch("/api/memories/" + photoUploadTripId + "/photos", {
          method: "POST",
          headers: authHeaders(),
          body: data
        });

        if (!response.ok) {
          const details = await response.json();
          throw new Error(details.error || "The photos could not be added.");
        }

        const updatedTrip = await response.json();
        setStatus("Photos added.");
        await renderTimeline();

        if (openTrip && openTrip.id === updatedTrip.id) {
          openViewer(updatedTrip);
        }
      } catch (error) {
        setStatus(error.message);
      } finally {
        photoUploadTripId = "";
        tripPhotoInput.value = "";
      }
    });

    viewerClose.addEventListener("click", closeViewer);
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) {
        closeViewer();
      }
    });

    coverModeButton.addEventListener("click", () => {
      if (!getSitePassword()) {
        setStatus("Enter the password to make changes.");
        return;
      }

      selectingCover = !selectingCover;
      deletingPhotos = false;
      selectedPhotos = new Set();
      viewer.classList.toggle("selecting-cover", selectingCover);
      viewer.classList.remove("deleting-photos");
      coverModeButton.classList.toggle("active", selectingCover);
      coverModeButton.textContent = selectingCover ? "Choose a photo" : "Make cover";
      deleteModeButton.classList.remove("active");
      deleteModeButton.textContent = "Delete photos";
      confirmDeleteButton.hidden = true;
      confirmDeleteButton.disabled = true;
      viewerGrid.querySelectorAll(".viewer-photo.selected").forEach((item) => item.classList.remove("selected"));
    });

    deleteModeButton.addEventListener("click", () => {
      if (!getSitePassword()) {
        setStatus("Enter the password to make changes.");
        return;
      }

      if (deletingPhotos) {
        exitDeleteMode();
      } else {
        enterDeleteMode();
      }
    });

    confirmDeleteButton.addEventListener("click", async () => {
      if (!openTrip || selectedPhotos.size === 0) {
        return;
      }

      try {
        confirmDeleteButton.disabled = true;
        viewerStatus.textContent = "Deleting photos...";

          const response = await fetch("/api/memories/" + openTrip.id + "/photos", {
            method: "DELETE",
            headers: authHeaders({
              "Content-Type": "application/json"
            }),
            body: JSON.stringify({
              photos: Array.from(selectedPhotos)
            })
        });

        if (!response.ok) {
          const details = await response.json();
          throw new Error(details.error || "The photos could not be deleted.");
        }

        const updatedTrip = await response.json();
        const index = currentTrips.findIndex((trip) => trip.id === updatedTrip.id);

        if (index !== -1) {
          currentTrips[index] = updatedTrip;
        }

        await renderTimeline();
        openViewer(updatedTrip);
        setStatus("Photos deleted.");
        viewerStatus.textContent = "Photos deleted.";
      } catch (error) {
        setStatus(error.message);
        viewerStatus.textContent = error.message;
        updateDeleteControls();
      }
    });

    viewerGrid.addEventListener("click", async (event) => {
      const photoButton = event.target.closest(".viewer-photo button");

      if (!photoButton || !openTrip) {
        return;
      }

      if (deletingPhotos) {
        togglePhotoSelection(photoButton);
        return;
      }

      if (!selectingCover) {
        openLightbox(photoButton.dataset.photo);
        return;
      }

      if (!getSitePassword()) {
        setStatus("Enter the password to make changes.");
        return;
      }

      const response = await fetch("/api/memories/" + openTrip.id, {
        method: "PATCH",
        headers: authHeaders({
          "Content-Type": "application/json"
        }),
        body: JSON.stringify({
          coverPhoto: photoButton.dataset.photo
        })
      });

      if (!response.ok) {
        setStatus("The cover photo could not be changed.");
        return;
      }

      const updatedTrip = await response.json();
      const index = currentTrips.findIndex((trip) => trip.id === updatedTrip.id);

      if (index !== -1) {
        currentTrips[index] = updatedTrip;
      }

      await renderTimeline();
      openViewer(updatedTrip);
      setStatus("Cover photo updated.");
    });

    lightboxClose.addEventListener("click", closeLightbox);
    photoLightbox.addEventListener("click", (event) => {
      if (event.target === photoLightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeLightbox();
        closeViewer();
      }
    });

    updateEditLock();
    renderTimeline().catch((error) => {
      timeline.innerHTML = '<div class="empty">Start the server to load the shared timeline.</div>';
      setStatus(error.message);
    });
  </script>
</body>
</html>
